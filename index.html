<style>
:root{
  --paper:#F2F0EA; --paper-hi:#F8F6F1; --ink:#13303B; --ink-soft:#4A5A61; --ink-faint:#8A9199;
  --brass:#B9842A; --rule:#CFCABE;
  --grid:rgba(19,48,59,.05); --grid-major:rgba(19,48,59,.08);
  --wm-op:.20;--wm-filter:blur(.45px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1F26; --paper-hi:#14282F; --ink:#EDEAE2; --ink-soft:#A9B4B8; --ink-faint:#6E7C82;
    --brass:#C18A2C; --rule:#2C4048;
    --grid:rgba(237,234,226,.045); --grid-major:rgba(237,234,226,.07);
    --wm-op:.22;--wm-filter:invert(1) blur(.45px);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px),
    linear-gradient(to right,var(--grid-major) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid-major) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;
  color:var(--ink);font-family:Jost,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.sheet{
  position:relative;z-index:1;
  height:100dvh;max-width:1180px;margin:0 auto;
  padding:clamp(16px,2.4vw,34px);
  display:flex;flex-direction:column;gap:clamp(10px,1.6vh,22px);
}
.lbl{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}

.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding-bottom:clamp(8px,1.2vh,14px);border-bottom:1px solid var(--rule);flex:none}
.lockup{display:block;height:clamp(24px,3vw,32px);width:auto}
.lockup-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .lockup-light{display:none}
  :root:not([data-theme="light"]) .lockup-dark{display:block}
}

h1{font-size:clamp(13px,2.4vw,28px);line-height:1.35;letter-spacing:0;white-space:nowrap;
  font-weight:400;margin:0;flex:none}
h1 span{display:inline}
h1 .l1{color:var(--ink-faint);font-weight:300}
h1 .l2{color:var(--ink);font-weight:400}

.wmwrap{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wm{position:absolute;top:52%;left:42%;transform:translate(-50%,-50%);
  width:min(92vw,960px);
  opacity:var(--wm-op);filter:var(--wm-filter);
  -webkit-mask-image:radial-gradient(ellipse 46% 44% at 50% 48%,#000 0%,rgba(0,0,0,.45) 40%,transparent 72%);
  mask-image:radial-gradient(ellipse 46% 44% at 50% 48%,#000 0%,rgba(0,0,0,.45) 40%,transparent 72%)}
.wm-svg{display:block;width:100%;height:auto}

.machine{flex:1 1 auto;min-height:0;margin:0;display:flex;flex-direction:column}
#machine{flex:1 1 auto;min-height:0;width:100%;height:100%;display:block;overflow:visible}
.mach-cap{flex:none;margin-top:clamp(6px,1vh,12px);padding-top:clamp(6px,1vh,10px);
  border-top:1px solid var(--rule);display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.hint{transition:opacity .5s ease}
.machine.used .hint{opacity:0}
#dial{cursor:grab;outline:none;touch-action:none}
#dial:active{cursor:grabbing}

#lock{--ox-ink:#13303B;--ox-brass:#B9842A;--ox-axa:#8F6621;--ox-hl:#DBAB53}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #lock{--ox-ink:#F2F0EA;--ox-axa:#C18A2C;--ox-brass:#C18A2C;--ox-hl:#DBAB53}
}
.mw{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.mw{animation:wob 5.2s ease-in-out infinite}}
@keyframes wob{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(1.6px,-2px) rotate(2.2deg)}
  66%{transform:translate(-1.4px,1.6px) rotate(-1.8deg)}
}
.messword{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;fill:var(--ink-faint)}
.messq{font-family:Jost,sans-serif;font-size:44px;fill:var(--ink-faint)}
.messshape{fill:none;stroke:var(--ink-faint);stroke-width:1.6}
.chip{fill:var(--paper);fill-opacity:.72;stroke:var(--brass);stroke-width:1.3}
.regshape{fill:none;stroke:var(--ink);stroke-width:1.6}
@media (prefers-reduced-motion:no-preference){
  #lock .knob{animation:knob 2.2s ease-in-out infinite}
}
@keyframes knob{0%,100%{opacity:1}50%{opacity:.38}}
.machine.used #lock .knob{animation:none;opacity:1}
.chiptext{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;
  letter-spacing:.16em;fill:var(--ink)}
.railline{stroke:var(--rule);stroke-width:1;stroke-dasharray:4 5}
.cap{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;fill:var(--ink-faint)}

.foot{flex:none}
.titleblock{border:1px solid var(--rule);background:var(--paper-hi);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.titleblock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cell{padding:clamp(6px,.9vh,11px) 13px;border-right:1px solid var(--rule);min-width:0}
.cell:last-child{border-right:0}
@media (max-width:700px){
  .cell{border-bottom:1px solid var(--rule)}
  .cell:nth-child(2n){border-right:0}
  .cell:nth-last-child(-n+2){border-bottom:0}
}
.cell dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.cell dd{margin:0;font-size:13.5px;color:var(--ink);overflow-wrap:break-word}
.cell a{color:inherit;text-decoration:none;border-bottom:1px solid var(--brass)}
.cell a:hover{border-bottom-color:var(--ink)}
.colophon{margin-top:clamp(6px,.9vh,11px);display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap}
.colophon p{margin:0;max-width:56ch}
</style>
</head>

        } else {
          sh = document.createElementNS(NS, 'polygon');
          sh.setAttribute('points', spec[1].split(' ').map(function (pt) {
            var xy = pt.split(','); return (xy[0] * L.sq) + ',' + (xy[1] * L.sq);
          }).join(' '));
        }
        sh.setAttribute('class', 'regshape');
        og.appendChild(sh);
      }

      g.appendChild(mg); g.appendChild(og);
      (i % 2 ? gOrd : gMess).appendChild(g);
      return { g: g, mg: mg, og: og };
    });
  }

  function frame(t) {
    setFrame(t);
    spin.setAttribute('transform', 'rotate(' + (t * 360 * TURNS).toFixed(2) + ' 32 32)');
    var n = 3, span = Math.max(0.22, 1 - STAGGER * (n - 1)), p = [], i, j;
    for (i = 0; i < n; i++) p.push(clamp((t - i * STAGGER) / span));
    for (i = 0; i < n; i++) {
      var x = -LW[i] * (1 - ease(p[i]));
      for (j = i + 1; j < n; j++) x += (LW[j] + TRACK) * ease(p[j]);
      Ls[i].setAttribute('transform', 'translate(' + (x - LOFF[i]).toFixed(2) + ' 0)');
    }
    var STAG = 0.055;
    for (i = 0; i < nodes.length; i++) {
      var pi = clamp((t - i * STAG) / (1 - STAG * (nodes.length - 1)));
      var st = L.start[i], en = slot(i), px, py, sc, mo, co, rot;
      if (pi <= 0.5) {
        var u = ease(pi / 0.5);
        var c1 = [lerp(st[0], L.wx, .55) + 18, lerp(st[1], L.wy, .55) - 26];
        var a = qbez([st[0], st[1]], c1, [L.wx, L.wy], u);
        px = a[0]; py = a[1]; sc = lerp(1, 0.18, u); rot = lerp(st[2], 0, u);
        mo = 1 - smooth(0.62, 1, u); co = 0;
      } else {
        var v = ease((pi - 0.5) / 0.5);
        var b = qbez([L.wx, L.wy], L.ctrl, [en[0], en[1]], v);
        px = b[0]; py = b[1]; sc = lerp(0.18, 1, v); rot = 0;
        mo = 0; co = smooth(0, 0.42, v);
      }
      nodes[i].g.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) +
        ') rotate(' + rot.toFixed(1) + ') scale(' + sc.toFixed(3) + ')');
      nodes[i].mg.setAttribute('opacity', mo.toFixed(3));
      nodes[i].og.setAttribute('opacity', co.toFixed(3));
    }
  }

  var t = 0, target = 0, raf = null, used = false, DUR = 900;
  function tick() {
    var step = 16 / DUR;
    if (Math.abs(target - t) < 0.004) t = target;
    else t += (target > t ? step : -step);
    t = clamp(t); frame(t);
    raf = (t !== target) ? requestAnimationFrame(tick) : null;
  }
  function to(v, dur) {
    DUR = dur || 900; target = clamp(v);
    if (reduce) { t = target; frame(t); return; }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function set(v) { t = target = clamp(v); frame(t); }
  function markUsed() { DUR = 900; if (!used) { used = true; mach.classList.add('used'); } }

  function pickLayout() {
    var want = (window.innerWidth < 880 || window.innerWidth < window.innerHeight) ? TALL : WIDE;
    if (want !== L || !nodes.length) { L = want; build(); frame(t); }
  }
  pickLayout();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(pickLayout, 160); });

  var dial = document.getElementById('dial'), dragging = false, lastAng = 0;
  function angleAt(ev) {
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    var sc = Math.min(r.width / vb.width, r.height / vb.height);
    var ox = r.left + (r.width - vb.width * sc) / 2, oy = r.top + (r.height - vb.height * sc) / 2;
    var ux = (ev.clientX - ox) / sc + vb.x, uy = (ev.clientY - oy) / sc + vb.y;
    return Math.atan2(uy - L.wy, ux - L.wx) * 180 / Math.PI;
  }
  dial.addEventListener('pointerdown', function (e) {
    dragging = true; lastAng = angleAt(e); markUsed();
    dial.setPointerCapture(e.pointerId); e.preventDefault();
  });
  dial.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var a = angleAt(e), d = a - lastAng;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    lastAng = a; set(t + d / (360 * TURNS));
  });
  ['pointerup', 'pointercancel'].forEach(function (k) {
    dial.addEventListener(k, function (e) {
      dragging = false; try { dial.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  });
  dial.addEventListener('wheel', function (e) {
    e.preventDefault(); markUsed(); set(t + e.deltaY * 0.0016);
  }, { passive: false });
  svg.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowUp') { markUsed(); to(target + 0.12); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowDown') { markUsed(); to(target - 0.12); e.preventDefault(); }
    else if (k === 'Home') { markUsed(); to(0); e.preventDefault(); }
    else if (k === 'End') { markUsed(); to(1); e.preventDefault(); }
  });

  if (reduce) { set(1); mach.classList.add('used'); }
  else setTimeout(function () { if (!used) to(1, 7000); }, 1400);

  window.ONDAXA_MACHINE = { set: set, to: to, get: function () { return t; } };
})();
</script>
</body>
</html>
